name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q

  commit-messages:
    name: Conventional commit subjects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE" ]]; then
            range="$PR_BASE..HEAD"
          elif [[ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER"
          fi
          echo "Checking range: $range"
          status=0
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            case "$subject" in
              "Merge "*) continue ;;
              'Revert "'*) continue ;;
            esac
            if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'; then
              echo "Bad commit subject: $subject"
              status=1
            fi
          done < <(git log --format='%s' $range)
          exit $status
