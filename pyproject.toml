[project]
name = "kura"
version = "0.1.0"
description = "A thin yt-dlp archive orchestrator CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "croniter",
    "ruamel.yaml",
    "yt-dlp",
]

[project.scripts]
kura = "kura.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kura"]
