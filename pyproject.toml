[project]
name = "kura"
version = "0.1.0"
description = "A thin yt-dlp archive orchestrator CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "croniter",
    "rich>=13",
    "ruamel.yaml",
    "textual>=0.80",
    "yt-dlp",
]

[project.scripts]
kura = "kura.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kura"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
